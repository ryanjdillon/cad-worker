name: build

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.lock
      - mcp-proxy.lock
      - cad-entrypoint
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Pinned by commit: a change in the workflows repository reaches this build
    # only through a reviewed bump here.
    uses: ryanjdillon/workflows/.github/workflows/docker-build-push.yml@f2e073fcc391380aaed22c2df70890d3d1494faa
    with:
      image: ryanjdillon/cad-worker
